<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuotas del auto</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1EC;--surface:#fff;--ink:#16242A;--muted:#5B6B70;--line:#D5DBD4;--accent:#1F5C4A;--accent-ink:#fff;--warn:#B4462B;--empty:#D5DBD4;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A1D;--surface:#17252A;--ink:#E7EEEA;--muted:#92A4A8;--line:#2A3C42;--accent:#5FBF9F;--accent-ink:#0B1A15;--warn:#F08A6B;--empty:#2A3C42;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101A1D;--surface:#17252A;--ink:#E7EEEA;--muted:#92A4A8;--line:#2A3C42;--accent:#5FBF9F;--accent-ink:#0B1A15;--warn:#F08A6B;--empty:#2A3C42;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em;margin:8px 0 4px;line-height:1.1}
h2{font-size:1.1rem;margin:0 0 12px}
p.sub{color:var(--muted);margin:0 0 20px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:block;font-weight:600;font-size:.9rem}
input{width:100%;margin-top:6px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
small.hint{display:block;color:var(--muted);font-weight:400;margin-top:4px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:6px;padding:10px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.msg{min-height:1.5em;margin:12px 0 0;font-weight:600}
.msg.err{color:var(--warn)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin:16px 0 8px}
.strip i{width:12px;height:22px;border-radius:2px;background:var(--empty)}
.strip i.on{background:var(--accent)}
.strip i.next{outline:2px solid var(--ink);outline-offset:1px}
.big{font-size:clamp(1.8rem,6vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 14px}
.tabs button{background:transparent;color:var(--ink);border-color:var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat span{display:block;color:var(--muted);font-size:.85rem}
.stat b{font-size:1.25rem}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.92rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th:last-child,td:last-child{text-align:left}
th{font-weight:600;color:var(--muted)}
tr.paid td{color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:.8rem}
.tag.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row label{flex:1 1 220px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Cuotas del auto</h1>
<p class="sub">Registra un crédito de vehículo, mira el plan de pagos y anota cada cuota a medida que el cliente la paga.</p>

<section id="setup" class="card" hidden>
  <h2>Datos del crédito</h2>
  <div class="grid">
    <label>Nombre del cliente<input id="nombre" autocomplete="off"></label>
    <label>Precio del carro<input id="precio" inputmode="decimal" placeholder="60000000"></label>
    <label>Cuota inicial (%)<input id="porc" inputmode="decimal" placeholder="20"><small class="hint">De 0 a 99,99</small></label>
    <label>Plazo (meses)<input id="meses" inputmode="numeric" placeholder="48"></label>
    <label>Tasa mensual (%)<input id="tasa" inputmode="decimal" placeholder="1,5"></label>
    <label>Seguro mensual<input id="seguro" inputmode="decimal" placeholder="120000"></label>
  </div>
  <p id="setupMsg" class="msg err" role="alert"></p>
  <button id="crear">Crear plan de pagos</button>
</section>

<section id="app" hidden>
  <div class="card">
    <div class="top">
      <div><h2 id="cliente" style="margin:0"></h2><span id="resumen" style="color:var(--muted)"></span></div>
      <button class="ghost" id="nuevo">Nuevo crédito</button>
    </div>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="big" id="progreso"></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="pagar" aria-selected="true">Pagar cuota</button>
    <button role="tab" data-tab="plan" aria-selected="false">Plan de pagos</button>
    <button role="tab" data-tab="estado" aria-selected="false">Estado</button>
    <button role="tab" data-tab="historial" aria-selected="false">Historial</button>
  </div>

  <div id="t-pagar" class="card">
    <h2 id="pagarTitulo"></h2>
    <div class="row">
      <label>Valor que entrega el cliente<input id="valor" inputmode="decimal"></label>
      <button id="registrar">Registrar pago</button>
    </div>
    <p id="pagarMsg" class="msg" role="status"></p>
  </div>
  <div id="t-plan" class="card" hidden><div class="wrap"><table id="tabla"></table></div></div>
  <div id="t-estado" class="card" hidden><div class="stats" id="stats"></div></div>
  <div id="t-historial" class="card" hidden><div class="wrap"><table id="hist"></table></div></div>
</section>
</main>

<script>
const KEY="cuotas-auto-v1";
let S=null;
const $=id=>document.getElementById(id);
const fmt=n=>"$"+new Intl.NumberFormat("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const num=v=>parseFloat(String(v).trim().replace(/\./g,"").replace(",","."));
// Acepta "1,5" o "1.5"; si hay un solo punto y no coma, se trata como decimal
const parse=v=>{v=String(v).trim();if(v==="")return NaN;if(!v.includes(",")&&(v.match(/\./g)||[]).length===1)return parseFloat(v);return num(v)};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;

function save(){try{S?localStorage.setItem(KEY,JSON.stringify(S)):localStorage.removeItem(KEY)}catch(e){}}
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}

function build(d){
  const inicial=d.precio*d.porc/100, fin=d.precio-inicial, i=d.tasa/100;
  const cuota=i===0?fin/d.meses:fin*i/(1-Math.pow(1+i,-d.meses));
  const tabla=[];let saldo=fin;
  for(let n=1;n<=d.meses;n++){
    const interes=r2(saldo*i);let capital=r2(cuota-interes);
    if(n===d.meses)capital=r2(saldo);
    const total=r2(interes+capital+d.seguro), sf=r2(saldo-capital);
    tabla.push({n,si:r2(saldo),interes,seguro:d.seguro,capital,total,sf,pagada:false});
    saldo=sf;
  }
  return {...d,inicial,fin,tabla,pagos:[]};
}

$("crear").onclick=()=>{
  const d={nombre:$("nombre").value.trim(),precio:parse($("precio").value),porc:parse($("porc").value),
    meses:parseInt($("meses").value,10),tasa:parse($("tasa").value),seguro:parse($("seguro").value)};
  let e="";
  if(!d.nombre)e="Escribe el nombre del cliente.";
  else if(!(d.precio>0))e="El precio debe ser mayor que 0.";
  else if(!(d.porc>=0&&d.porc<100))e="La cuota inicial debe estar entre 0 y 99,99.";
  else if(!(d.meses>=1))e="El plazo debe ser de al menos 1 mes.";
  else if(!(d.tasa>=0))e="La tasa no puede ser negativa.";
  else if(!(d.seguro>=0))e="El seguro no puede ser negativo.";
  $("setupMsg").textContent=e;
  if(e)return;
  S=build(d);save();render();
};

$("nuevo").onclick=()=>{if(confirm("Se borrará el crédito actual. ¿Continuar?")){S=null;save();render()}};

$("registrar").onclick=()=>{
  const sig=S.tabla.find(f=>!f.pagada);if(!sig)return;
  const raw=$("valor").value, v=raw.trim()===""?0:parse(raw), m=$("pagarMsg");
  m.className="msg err";
  if(isNaN(v)){m.textContent="Escribe un valor numérico.";return}
  if(v<0){m.textContent="El valor no puede ser negativo.";return}
  if(v===0){m.className="msg";m.textContent="Pago cancelado.";return}
  if(v<sig.total){m.textContent="Valor insuficiente. Faltan "+fmt(sig.total-v)+" para cubrir la cuota.";return}
  sig.pagada=true;
  const dev=r2(v-sig.total);
  S.pagos.push({n:sig.n,cuota:sig.total,valor:v,dev,fecha:new Date().toLocaleDateString("es-CO")});
  save();$("valor").value="";render();
  const m2=$("pagarMsg");m2.className="msg";
  m2.textContent="Cuota "+sig.n+" registrada como pagada."+(dev>0?" Devuelva al cliente "+fmt(dev)+".":"");
};

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["pagar","plan","estado","historial"].forEach(t=>$("t-"+t).hidden=t!==b.dataset.tab);
});

function render(){
  $("setup").hidden=!!S;$("app").hidden=!S;
  if(!S){$("pagarMsg").textContent="";return}
  const T=S.tabla,pag=T.filter(f=>f.pagada),sig=T.find(f=>!f.pagada);
  $("cliente").textContent=S.nombre;
  $("resumen").textContent=fmt(S.precio)+" · inicial "+fmt(S.inicial)+" · financiado "+fmt(S.fin)+" · "+S.meses+" meses";
  $("strip").innerHTML=T.map(f=>'<i class="'+(f.pagada?"on":f===sig?"next":"")+'"></i>').join("");
  $("progreso").textContent=pag.length+" de "+S.meses+" cuotas pagadas";
  $("pagarTitulo").textContent=sig?"Cuota "+sig.n+": "+fmt(sig.total):"Todas las cuotas están pagadas";
  $("t-pagar").querySelector(".row").hidden=!sig;
  $("tabla").innerHTML="<thead><tr><th>N°</th><th>Saldo inicial</th><th>Interés</th><th>Seguro</th><th>Capital</th><th>Cuota total</th><th>Saldo final</th><th>Estado</th></tr></thead><tbody>"+
    T.map(f=>'<tr class="'+(f.pagada?"paid":"")+'"><td>'+f.n+"</td><td>"+fmt(f.si)+"</td><td>"+fmt(f.interes)+"</td><td>"+fmt(f.seguro)+"</td><td>"+fmt(f.capital)+"</td><td>"+fmt(f.total)+"</td><td>"+fmt(f.sf)+'</td><td><span class="tag '+(f.pagada?"ok":"")+'">'+(f.pagada?"Pagada":"Pendiente")+"</span></td></tr>").join("")+"</tbody>";
  const capPag=pag.reduce((a,f)=>a+f.capital,0), totPag=pag.reduce((a,f)=>a+f.total,0);
  const saldo=pag.length===T.length?0:(pag.length?pag[pag.length-1].sf:S.fin);
  const st=[["Cuotas pagadas",pag.length+" de "+S.meses],["Cuotas pendientes",S.meses-pag.length],["Total pagado en cuotas",fmt(totPag)],["Saldo pendiente del capital",fmt(saldo)],["Porcentaje pagado del carro",((S.inicial+capPag)/S.precio*100).toFixed(2).replace(".",",")+"%"]];
  $("stats").innerHTML=st.map(s=>'<div class="stat"><span>'+s[0]+"</span><b>"+s[1]+"</b></div>").join("");
  $("hist").innerHTML=S.pagos.length?"<thead><tr><th>Pago</th><th>Cuota N°</th><th>Fecha</th><th>Valor de la cuota</th><th>Entregado</th><th>Devuelta</th></tr></thead><tbody>"+
    S.pagos.map((p,k)=>"<tr><td>"+(k+1)+"</td><td>"+p.n+"</td><td>"+p.fecha+"</td><td>"+fmt(p.cuota)+"</td><td>"+fmt(p.valor)+"</td><td>"+fmt(p.dev)+"</td></tr>").join("")+"</tbody>":"<tbody><tr><td>Aún no se ha registrado ningún pago.</td></tr></tbody>";
}

S=load();render();
</script>
</body>
</html>
